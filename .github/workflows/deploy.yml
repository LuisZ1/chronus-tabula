# Pipeline de Chronus Tabula
#
# En cada push a main:
#   1. valida historia.json (python api/validar.py) — si falla, NO se despliega
#   2. publica la carpeta web/ en GitHub Pages
#
# La web es 100 % estática, así que no hay build: se sube web/ tal cual.
# El panel de administración (admin.html) también se publica, pero sin la API
# local muestra su aviso y no hace nada: el pipeline editorial sigue siendo local.

name: Validar y desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # botón «Run workflow» manual en la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar historia.json
        run: python api/validar.py

  desplegar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
