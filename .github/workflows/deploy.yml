# Pipeline de Chronus Tabula
#
# En cada push a main:
#   1. comprueba el formato canónico de datos/ (python api/formatear.py --check)
#      y valida los datos (python api/validar.py) — si algo falla, NO se despliega
#   2. compila datos/ (un fichero por entidad) en web/data/historia.json,
#      el único JSON que descarga la web (python api/compilar.py)
#   3. publica la carpeta web/ en GitHub Pages
#
# La web es 100 % estática: el único "build" es ese compilado del JSON.
# historia.json no se versiona (está en .gitignore): se genera aquí y, en local,
# lo generan servidor.py al arrancar y exportar.py al aplicar propuestas.
# El panel de administración (admin.html) también se publica, pero sin la API
# local muestra su aviso y no hace nada: el pipeline editorial sigue siendo local.

name: Validar, compilar y desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # botón «Run workflow» manual en la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar el formato canónico de datos/
        run: python api/formatear.py --check
      - name: Comprobar que los mapas base no traen entidades duplicadas
        run: python api/limpiar_geojson.py --check
      - name: Validar los datos (datos/) contra schema/
        run: python api/validar.py

  desplegar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar datos/ → web/data/historia.json
        run: python api/compilar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
