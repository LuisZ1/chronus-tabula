<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- color de la barra del navegador en móvil: el del fondo del mapa -->
  <meta name="theme-color" content="#d4e6f1">
  <title>Chronus Tabula</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d1d1f' stroke-width='1.6' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <!-- sistema visual común (tipografía Montserrat, colores, radios): antes que la hoja del mapa -->
  <link rel="stylesheet" href="css/marca.css?v=3">
  <!-- ?v=N rompe la caché del navegador cuando cambian estilos o lógica: súbelo al tocar css/js -->
  <link rel="stylesheet" href="css/styles.css?v=34">
</head>
<body>
  <div id="map"></div>

  <div id="topbar">
    <h1 data-i18n="app.title">Chronus Tabula</h1>
    <span class="follow-box">
      <input id="followInput" list="entidadesList" data-i18n-placeholder="follow.placeholder" placeholder="Seguir un reino…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <datalist id="entidadesList"></datalist>
      <button id="followClear" class="mini-btn" data-i18n-title="follow.clear" title="Dejar de seguir" hidden>✕</button>
    </span>
    <!-- idioma: solo la bandera (fuente de banderas propia en css/marca.css, porque
         Windows no pinta los emojis de banderas). Botón + menú propios: el desplegable
         nativo no deja centrar las banderas. El <select> oculto sigue guardando el
         valor y lanzando 'change' (js/arranque.js: montarMenuIdioma) -->
    <span class="lang-box">
      <button type="button" id="langBtn" class="lang-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu" title="Idioma · Language" aria-label="Idioma · Language"><span class="bandera" aria-hidden="true">🇪🇸</span></button>
      <ul id="langMenu" class="lang-menu" role="listbox" aria-label="Idioma · Language" hidden>
        <li role="option" data-lang="es" title="Español" aria-label="Español"><span class="bandera" aria-hidden="true">🇪🇸</span></li>
        <li role="option" data-lang="en" title="English" aria-label="English"><span class="bandera" aria-hidden="true">🇬🇧</span></li>
      </ul>
      <select id="langSelect" hidden aria-hidden="true" tabindex="-1">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </span>
    <a href="index.html#controles" id="helpBtn" data-i18n-title="ui.help" title="Ayuda: cómo se usa el mapa" aria-label="Ayuda">?</a>
  </div>

  <div id="layersPanel">
    <div class="panel-title" id="layersTitle" role="button" tabindex="0" aria-expanded="true" aria-controls="layersPanel" data-i18n="layers.title">Capas</div>
    <label><input type="checkbox" id="lyBatallas" checked> <span data-i18n="layers.battles">Batallas</span></label>
    <label><input type="checkbox" id="lyZonas" checked> <span data-i18n="layers.zones">Zonas de guerra</span></label>
    <label><input type="checkbox" id="lyEventos" checked> <span data-i18n="layers.events">Eventos</span></label>
    <label><input type="checkbox" id="lyTerritorios" checked> <span data-i18n="layers.territories">Territorios menores</span></label>
    <label><input type="checkbox" id="lyNombres" checked> <span data-i18n="layers.names">Nombres</span></label>
    <label class="emblema-row"><input type="checkbox" id="lyEscudos" checked>
      <select id="emblemaSelect" data-i18n-title="layers.emblemTitle" title="Junto al nombre de cada país: su escudo o su bandera del año consultado (uno u otro)">
        <option value="escudo" data-i18n="layers.coa">Escudos</option>
        <option value="bandera" data-i18n="layers.flags">Banderas</option>
      </select>
    </label>
    <label><input type="checkbox" id="lyRelleno" checked> <span data-i18n="layers.fill">Colores</span></label>
    <label data-i18n-title="layers.territorialTitle" title="Al seguir un reino, resaltar también a quienes gobernaron antes su territorio sin ser el mismo Estado (p. ej. el Califato de Córdoba al seguir España)"><input type="checkbox" id="lyTerritorial"> <span data-i18n="layers.territorial">Seguir antecesores territoriales</span></label>
    <label class="margen-row" data-i18n-title="layers.marginTitle" title="Mostrar también batallas y eventos de años cercanos al elegido">
      <span data-i18n="layers.margin">Margen de años</span>
      <select id="margenSelect">
        <option value="0">±0</option>
        <option value="1">±1</option>
        <option value="2">±2</option>
        <option value="5">±5</option>
        <option value="10">±10</option>
      </select>
    </label>
  </div>

  <div id="rightPanels">
    <div id="yearPanel">
      <div class="panel-title legend-head">
        <span><span data-i18n="panel.thisYear">Este año</span>: <span id="ypYear"></span></span>
        <button id="yearPanelToggle" class="mini-btn" title="Plegar/desplegar">▾</button>
      </div>
      <div id="yearPanelBody">
        <div class="yp-sec" data-i18n="panel.wars">Conflictos activos</div>
        <div id="ypWars"></div>
        <div class="yp-sec" data-i18n="panel.facts">Datos de interés</div>
        <div id="ypFacts"></div>
      </div>
    </div>
    <div id="legendPanel">
      <div class="panel-title legend-head">
        <span data-i18n="legend.title">Entidades del año</span>
        <button id="legendToggle" class="mini-btn" title="Plegar/desplegar">▾</button>
      </div>
      <div id="legendList"></div>
    </div>
  </div>

  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <span data-i18n="ui.loading">Cargando…</span>
  </div>

  <div id="timebar">
    <div class="timebar-row">
      <button id="playBtn" class="step-btn" data-i18n-title="play.title" title="Reproducir la historia">▶</button>
      <select id="speedSelect" data-i18n-title="play.speed" title="Velocidad">
        <option value="2500">1×</option>
        <option value="1200" selected>2×</option>
        <option value="600">4×</option>
      </select>
      <button id="prevYear" class="step-btn" title="Retroceder">◀</button>
      <div class="slider-wrap">
        <div id="sliderBubble" class="slider-bubble" hidden>1492</div>
        <input type="range" id="yearSlider" min="0" max="1000" step="1" value="497" data-i18n-aria="ui.sliderLabel" aria-label="Año del mapa">
        <div id="timeMarks"></div>
      </div>
      <button id="nextYear" class="step-btn" title="Avanzar">▶</button>
      <input type="number" id="yearInput" min="-3000" max="2026" step="1" value="1492" inputmode="numeric" enterkeyhint="go" data-i18n-title="ui.typeYear" title="Escribe un año (negativo = a. C.)" data-i18n-aria="ui.typeYear" aria-label="Escribe un año (negativo = a. C.)">
    </div>
    <!-- marcas en móvil: franja a todo el ancho (el hueco bajo el deslizador es
         demasiado estrecho); son un índice de pastillas que se tocan para ver la lista -->
    <div id="timeMarksM"></div>
    <!-- salto de las flechas visible (solo móvil; en escritorio basta el tooltip) -->
    <div id="pasoInfo" class="paso-info"></div>
    <!-- navegador de zoom (escritorio): tiradores para acercar/alejar la ventana visible -->
    <div id="navBar" data-i18n-title="nav.title" title="Arrastra los tiradores para acercar la vista; el centro para desplazarte (doble clic: ver todo)">
      <div class="nav-eras"></div>
      <div class="nav-win" id="navWin"><span class="nav-h l"></span><span class="nav-h r"></span></div>
    </div>
    <div class="timebar-row labels">
      <span class="range-edge" id="edgeLo">3000 a. C.</span>
      <span id="showingLabel"><span data-i18n="ui.showing">Fronteras de</span>: <strong id="shownYear">1492</strong></span>
      <span class="range-edge" id="edgeHi">2026</span>
    </div>
  </div>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="lib/polygon-clipping/polygon-clipping.umd.min.js"></script>
  <!-- lógica de la app, por secciones (ámbito global compartido; el orden importa) -->
  <script src="js/i18n.js?v=30"></script>
  <script src="js/nucleo.js?v=31"></script>
  <script src="js/datos.js?v=33"></script>
  <script src="js/fichas.js?v=35"></script>
  <script src="js/zonas.js?v=29"></script>
  <script src="js/capas.js?v=29"></script>
  <script src="js/mapa.js?v=33"></script>
  <script src="js/paneles.js?v=31"></script>
  <script src="js/tiempo.js?v=30"></script>
  <script src="js/arranque.js?v=32"></script>
</body>
</html>
